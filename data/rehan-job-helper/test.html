<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Sample Profile Form</title>
	<style>
		:root{
			--bg:#f5f7fb;
			--card:#ffffff;
			--muted:#6b7280;
			--text:#0f172a;
			--accent:#2563eb;
			--edge:#e6eefc;
		}

		/* Base */
		html,body{height:100%}
		body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:28px}
		.container{max-width:1100px;margin:0 auto}

		header{margin:8px 0 18px}
		h1{font-size:20px;margin:0 0 6px;font-weight:700}
		p.lead{margin:0;color:var(--muted)}

		/* Card */
		form{background:var(--card);border-radius:14px;padding:22px 22px 18px;margin-top:14px;box-shadow:0 8px 30px rgba(15,23,42,0.06);border:1px solid rgba(15,23,42,0.03)}

		fieldset{border:0;margin:0;padding:18px 0 6px}
		fieldset + fieldset{border-top:1px dashed rgba(15,23,42,0.04);padding-top:20px;margin-top:8px}
		legend{font-weight:700;margin-bottom:12px;padding:6px 0;font-size:15px}

		/* Responsive grid: auto-fit columns */
		.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
		.full{grid-column:1/-1}

		label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
		input,textarea,select{width:100%;padding:11px 12px;border:1px solid #e8edf5;border-radius:10px;font-size:14px;background:#fff;color:var(--text);box-sizing:border-box;transition:box-shadow .12s ease,border-color .12s ease}
		input::placeholder,textarea::placeholder{color:#9aa3b2}
		input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 6px 20px rgba(37,99,235,0.08)}
		textarea{min-height:90px;resize:vertical}

		.company-block{border:1px solid var(--edge);padding:12px;border-radius:10px;background:linear-gradient(180deg,#ffffff, #fbfdff)}
		.company-block strong{display:block;margin-bottom:8px}

		.btn-row{display:flex;justify-content:flex-end;margin-top:14px}
		button{background:var(--accent);color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer}
		button:active{transform:translateY(1px)}

		/* Small screens adjustments */
		@media (max-width:720px){
			body{padding:18px}
			form{padding:16px}
			legend{font-size:14px}
			.grid{gap:12px}
		}

		/* Utility */
		.muted{color:var(--muted);font-size:13px}
	</style>
</head>
<body>
	<div class="container">
		<header>
			<h1>Profile — Sample Form</h1>
			<p class="lead">A clean, sectioned form generated from your savedData schema.</p>
		</header>

		<form id="profileForm">
			<fieldset>
				<legend>Personal Information</legend>
				<div class="grid">
					<div>
						<label for="first_name">First Name</label>
						<input id="first_name" name="first_name" type="text" placeholder="First Name" />
					</div>
					<div>
						<label for="last_name">Last Name</label>
						<input id="last_name" name="last_name" type="text" placeholder="Last Name" />
					</div>
					<div>
						<label for="legal_full_name">Legal Full Name</label>
						<input id="legal_full_name" name="legal_full_name" type="text" placeholder="Legal Full Name" />
					</div>
					<div>
						<label for="date_of_birth">Date of Birth</label>
						<input id="date_of_birth" name="date_of_birth" type="date" />
					</div>
					<div class="full">
						<label for="personal_address_1">Address</label>
						<input id="personal_address_1" name="personal_address_1" type="text" placeholder="Street, City, State" />
					</div>
					<div>
						<label for="city">City</label>
						<input id="city" name="city" type="text" />
					</div>
					<div>
						<label for="current_city">Current City</label>
						<input id="current_city" name="current_city" type="text" />
					</div>
					<div>
						<label for="passport_number">Passport Number</label>
						<input id="passport_number" name="passport_number" type="text" />
					</div>
				</div>
			</fieldset>

			<fieldset>
				<legend>Contact</legend>
				<div class="grid">
					<div>
						<label for="contact_phone_number">Phone</label>
						<input id="contact_phone_number" name="contact_phone_number" type="tel" />
					</div>
					<div>
						<label for="email">Email</label>
						<input id="email" name="email" type="email" />
					</div>
					<div>
						<label for="linkedin">LinkedIn</label>
						<input id="linkedin" name="linkedin" type="text" placeholder="https://..." />
					</div>
					<div>
						<label for="website">Website</label>
						<input id="website" name="website" type="text" placeholder="https://..." />
					</div>
				</div>
			</fieldset>

			<fieldset>
				<legend>Career Snapshot</legend>
				<div class="grid">
					<div>
						<label for="headline">Headline</label>
						<input id="headline" name="headline" type="text" />
					</div>
					<div>
						<label for="industries">Industries</label>
						<input id="industries" name="industries" type="text" />
					</div>
					<div class="full">
						<label for="overall_years_of_experience_year_and_month">Overall Experience (years & months)</label>
						<input id="overall_years_of_experience_year_and_month" name="overall_years_of_experience_year_and_month" type="text" placeholder="e.g. 5 years 3 months" />
					</div>
				</div>
			</fieldset>

			<fieldset>
				<legend>Education</legend>
				<div class="grid">
					<div>
						<label for="college">College</label>
						<input id="college" name="college" type="text" />
					</div>
					<div>
						<label for="degree">Degree</label>
						<input id="degree" name="degree" type="text" />
					</div>
					<div>
						<label for="field_of_study">Field Of Study</label>
						<input id="field_of_study" name="field_of_study" type="text" />
					</div>
					<div>
						<label for="college_end_date">College End Date</label>
						<input id="college_end_date" name="college_end_date" type="date" />
					</div>
				</div>
			</fieldset>

			<fieldset>
				<legend>Work Experience</legend>
				<div class="grid">
					<div class="full company-block">
						<strong>Company 1</strong>
						<div class="grid" style="margin-top:10px">
							<div>
								<label for="company_1">Name</label>
								<input id="company_1" name="company_1" type="text" />
							</div>
							<div>
								<label for="company_1_title">Title</label>
								<input id="company_1_title" name="company_1_title" type="text" />
							</div>
							<div>
								<label for="company_1_start_date">Start Date</label>
								<input id="company_1_start_date" name="company_1_start_date" type="date" />
							</div>
							<div>
								<label for="company_1_end_date">End Date</label>
								<input id="company_1_end_date" name="company_1_end_date" type="date" />
							</div>
						</div>
					</div>

					<div class="full company-block">
						<strong>Company 2</strong>
						<div class="grid" style="margin-top:10px">
							<div>
								<label for="company_2">Name</label>
								<input id="company_2" name="company_2" type="text" />
							</div>
							<div>
								<label for="company_2_title">Title</label>
								<input id="company_2_title" name="company_2_title" type="text" />
							</div>
							<div>
								<label for="company_2_start">Start Date</label>
								<input id="company_2_start" name="company_2_start" type="date" />
							</div>
							<div>
								<label for="company_2_end">End Date</label>
								<input id="company_2_end" name="company_2_end" type="date" />
							</div>
						</div>
					</div>

					<div class="full company-block">
						<strong>Company 3</strong>
						<div class="grid" style="margin-top:10px">
							<div>
								<label for="company_3_name">Name</label>
								<input id="company_3_name" name="company_3_name" type="text" />
							</div>
							<div>
								<label for="company_3_title">Title</label>
								<input id="company_3_title" name="company_3_title" type="text" />
							</div>
							<div>
								<label for="company_3_start">Start Date</label>
								<input id="company_3_start" name="company_3_start" type="date" />
							</div>
							<div>
								<label for="company_3_end">End Date</label>
								<input id="company_3_end" name="company_3_end" type="date" />
							</div>
						</div>
					</div>

					<div class="full company-block">
						<strong>Company 4</strong>
						<div class="grid" style="margin-top:10px">
							<div>
								<label for="company_4">Name</label>
								<input id="company_4" name="company_4" type="text" />
							</div>
							<div>
								<label for="company_4_title">Title</label>
								<input id="company_4_title" name="company_4_title" type="text" />
							</div>
							<div>
								<label for="company_4_start">Start Date</label>
								<input id="company_4_start" name="company_4_start" type="date" />
							</div>
							<div>
								<label for="company_4_end">End Date</label>
								<input id="company_4_end" name="company_4_end" type="date" />
							</div>
						</div>
					</div>

				</div>
			</fieldset>

			<fieldset>
				<legend>Compensation & Availability</legend>
				<div class="grid">
					<div>
						<label for="current_salary">Current Salary</label>
						<input id="current_salary" name="current_salary" type="number" />
					</div>
					<div>
						<label for="current_expected">Current Expected</label>
						<input id="current_expected" name="current_expected" type="text" />
					</div>
					<div>
						<label for="desired_salary">Desired Salary</label>
						<input id="desired_salary" name="desired_salary" type="tel" />
					</div>
					<div>
						<label for="india_ctc_inr">India CTC (INR)</label>
						<input id="india_ctc_inr" name="india_ctc_inr" type="text" />
					</div>
					<div>
						<label for="india_ctc_expected_inr">India CTC Expected (INR)</label>
						<input id="india_ctc_expected_inr" name="india_ctc_expected_inr" type="text" />
					</div>
					<div>
						<label for="date_available">Date Available</label>
						<input id="date_available" name="date_available" type="date" />
					</div>
					<div class="full">
						<label for="time_availability_interview_call">Time Availability (Interview)</label>
						<input id="time_availability_interview_call" name="time_availability_interview_call" type="text" placeholder="e.g. Weekdays 10:00-16:00" />
					</div>
				</div>
			</fieldset>

			<fieldset>
				<legend>Messages</legend>
				<div class="grid">
					<div class="full">
						<label for="linkedin_message">LinkedIn Message</label>
						<textarea id="linkedin_message" name="linkedin_message" placeholder="Message for recruiters..."></textarea>
					</div>
					<div class="full">
						<label for="message">General Message</label>
						<textarea id="message" name="message"></textarea>
					</div>
				</div>
			</fieldset>

			<div class="btn-row">
				<button type="submit">Save Profile</button>
			</div>
		</form>
	</div>

	<script>
		// Lightweight: prevent submit for demo
		document.getElementById('profileForm').addEventListener('submit', function(e){
			e.preventDefault();
			alert('Form submission is disabled in this demo.');
		});
	</script>
</body>
</html>
